<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>查詢 Wiktionary（Latin / EN）</title>
    <style>
      :root {
        --bg: #ffffff;
        --panel: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
        --accent: #2563eb;
        --accent-weak: rgba(37, 99, 235, 0.12);
        --danger: #b91c1c;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        overflow-x: hidden;
      }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", "PingFang TC",
          "Microsoft JhengHei", sans-serif;
        background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
        color: var(--text);
        overflow-x: hidden;
      }

      .page {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px 16px 28px;
      }

      .header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      .title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.2px;
        margin: 0;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        gap: 14px;
        min-width: 0;
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        overflow: hidden;
        min-width: 0;
      }

      .controls {
        padding: 14px;
        border-bottom: 1px solid var(--border);
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
        gap: 10px;
        min-width: 0;
      }

      .controls-left {
        display: grid;
        grid-template-columns: minmax(240px, 1fr) auto auto;
        align-items: start;
        gap: 10px;
        min-width: 0;
        width: 100%;
      }

      .input {
        width: 100%;
        box-sizing: border-box;
        min-width: 220px;
        padding: 10px 12px;
        font-size: 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        outline: none;
        background: #fff;
      }

      .input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-weak);
      }

      .btn {
        padding: 10px 14px;
        font-size: 15px;
        font-weight: 600;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #fff;
        cursor: pointer;
        white-space: nowrap;
      }

      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .btn-sm {
        padding: 8px 10px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 10px;
      }

      .btn-subtle {
        background: #f9fafb;
      }

      .segment {
        display: inline-flex;
        flex: 0 0 auto;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #f9fafb;
      }

      .segment-btn {
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        padding: 7px 10px;
        white-space: nowrap;
      }

      .segment-btn[aria-pressed="true"] {
        background: #fff;
        color: var(--accent);
        box-shadow: 0 1px 6px rgba(17, 24, 39, 0.1);
      }

      .btn:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
        margin-left: auto;
        white-space: nowrap;
        justify-self: end;
        padding-top: 10px;
      }

      .status[data-variant="error"] {
        color: var(--danger);
      }

      .spinner {
        width: 14px;
        height: 14px;
        border-radius: 999px;
        border: 2px solid rgba(107, 114, 128, 0.35);
        border-top-color: rgba(37, 99, 235, 0.95);
        animation: spin 0.9s linear infinite;
      }

      .spinner[hidden] {
        display: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .frame-wrap {
        position: relative;
        height: calc(100vh - 180px);
        min-height: 420px;
      }

      @media (max-width: 980px) {
        .frame-wrap {
          height: 70vh;
        }
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(2px);
        transition: opacity 150ms ease;
        pointer-events: none;
      }

      .overlay[hidden] {
        opacity: 0;
        display: none;
      }

      .overlay-card {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #fff;
        box-shadow: 0 8px 22px rgba(17, 24, 39, 0.12);
        color: var(--muted);
        font-size: 13px;
        max-width: 90%;
      }

      .history {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .history-header {
        padding: 14px 14px 10px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .history-title {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
      }

      .history-list {
        list-style: none;
        padding: 8px;
        margin: 0;
        overflow: auto;
        flex: 1 1 auto;
      }

      .history-item {
        display: flex;
        gap: 8px;
        padding: 6px;
        border-radius: 10px;
        align-items: center;
      }

      .history-item:hover {
        background: #f3f4f6;
      }

      .history-btn {
        flex: 1 1 auto;
        text-align: left;
        border: 0;
        background: transparent;
        padding: 6px 8px;
        border-radius: 8px;
        cursor: pointer;
        color: var(--text);
        font-size: 14px;
        line-height: 1.2;
        word-break: break-word;
      }

      .history-lang {
        flex: 0 0 auto;
        min-width: 42px;
        text-align: center;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
        background: #fff;
        font-size: 11px;
        font-weight: 700;
        padding: 4px 6px;
      }

      .history-empty {
        color: var(--muted);
        font-size: 13px;
        padding: 10px;
      }

      .hint {
        color: var(--muted);
        font-size: 12px;
        padding: 10px 14px 14px;
        border-top: 1px solid var(--border);
      }

      .quick-actions {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: thin;
      }

      .quick-actions .btn {
        flex: 0 0 auto;
      }

      @media (max-width: 980px) {
        .controls {
          grid-template-columns: 1fr;
        }

        .status {
          justify-self: start;
          padding-top: 0;
          white-space: normal;
        }
      }

      @media (max-width: 720px) {
        .controls-left {
          grid-template-columns: 1fr;
        }

        .input {
          grid-column: 1 / -1;
          min-width: 0;
        }

        .segment {
          display: flex;
          width: 100%;
          box-sizing: border-box;
        }

        .segment-btn {
          flex: 1 1 0;
        }

        .btn-primary {
          width: 100%;
        }

        .quick-actions {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          overflow-x: visible;
        }

        .quick-actions .btn {
          min-width: 0;
          padding-left: 8px;
          padding-right: 8px;
          text-align: center;
        }
      }

      @media (max-width: 420px) {
        .page {
          padding-left: 10px;
          padding-right: 10px;
        }

        .controls {
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="header">
        <div>
          <h1 class="title">查詢 Wiktionary（Latin / EN）</h1>
          <p class="subtitle">輸入單字後按 Enter 或點查詢，可指定定位到 Wiktionary 的 Latin 或 English 區塊。</p>
        </div>
      </div>

      <div class="layout">
        <div class="card">
          <div class="controls">
            <div class="controls-left">
              <input class="input" type="text" id="wordInput" placeholder="輸入拉丁文單字…" autocomplete="off" />
              <div class="segment" aria-label="預設定位區塊">
                <button class="segment-btn" id="latinModeBtn" type="button" aria-pressed="true">Latin</button>
                <button class="segment-btn" id="englishModeBtn" type="button" aria-pressed="false">EN</button>
              </div>
              <button class="btn btn-primary" id="lookupBtn" type="button">查詢</button>
              <div class="quick-actions" aria-label="快速操作">
                <button class="btn btn-sm btn-subtle" id="backBtn" type="button" title="返回 iframe 內的上一頁">上一頁</button>
                <button class="btn btn-sm btn-subtle" id="pasteBtn" type="button" title="清除後貼上剪貼簿內容">貼上</button>
                <button class="btn btn-sm btn-subtle" id="deleteCharBtn" type="button" title="刪除游標前一個字元">退格</button>
                <button class="btn btn-sm btn-subtle" id="clearInputBtn" type="button" title="清除搜尋框">清除</button>
                <button class="btn btn-sm btn-subtle" id="lookupLatinBtn" type="button" title="以目前輸入查 Latin">查 Latin</button>
                <button class="btn btn-sm btn-subtle" id="lookupEnglishBtn" type="button" title="以目前輸入查 English">查 EN</button>
                <button class="btn btn-sm btn-subtle" id="jumpLatinBtn" type="button" title="跳到目前頁面的 Latin 區塊">Latin</button>
                <button class="btn btn-sm btn-subtle" id="jumpEnglishBtn" type="button" title="跳到目前頁面的 English 區塊">EN</button>
              </div>
            </div>
            <div class="status" id="status" data-variant="idle">
              <span class="spinner" id="spinner" hidden></span>
              <span id="statusText">待命</span>
            </div>
          </div>

          <div class="frame-wrap">
            <iframe id="wikiFrame" title="Wiktionary (Latin / English)" src="about:blank"></iframe>
            <div class="overlay" id="overlay" hidden>
              <div class="overlay-card">
                <span class="spinner"></span>
                <span id="overlayText">查詢中…</span>
              </div>
            </div>
          </div>
        </div>

        <aside class="card history" aria-label="歷史紀錄">
          <div class="history-header">
            <h2 class="history-title">歷史紀錄</h2>
            <button class="btn" id="clearHistoryBtn" type="button">清除</button>
          </div>
          <ul class="history-list" id="historyList"></ul>
          <div class="hint">最多保留 10 筆；歷史會保留 Latin / EN 目標。</div>
        </aside>
      </div>
    </div>

    <script>
      const HISTORY_KEY = "latinLookupHistory.v2";
      const HISTORY_MAX = 10;
      const SECTION_TARGETS = {
        latin: { label: "Latin", hash: "Latin" },
        en: { label: "EN", hash: "English" }
      };

      const wordInput = document.getElementById("wordInput");
      const lookupBtn = document.getElementById("lookupBtn");
      const wikiFrame = document.getElementById("wikiFrame");
      const statusEl = document.getElementById("status");
      const statusText = document.getElementById("statusText");
      const spinner = document.getElementById("spinner");
      const overlay = document.getElementById("overlay");
      const overlayText = document.getElementById("overlayText");
      const historyList = document.getElementById("historyList");
      const clearHistoryBtn = document.getElementById("clearHistoryBtn");
      const backBtn = document.getElementById("backBtn");
      const pasteBtn = document.getElementById("pasteBtn");
      const deleteCharBtn = document.getElementById("deleteCharBtn");
      const clearInputBtn = document.getElementById("clearInputBtn");
      const jumpLatinBtn = document.getElementById("jumpLatinBtn");
      const jumpEnglishBtn = document.getElementById("jumpEnglishBtn");
      const lookupLatinBtn = document.getElementById("lookupLatinBtn");
      const lookupEnglishBtn = document.getElementById("lookupEnglishBtn");
      const latinModeBtn = document.getElementById("latinModeBtn");
      const englishModeBtn = document.getElementById("englishModeBtn");

      let pendingWord = null;
      let pendingSection = "latin";
      let pendingFrameAction = null;
      let activeSection = "latin";
      let history = loadHistory();

      setActiveSection(activeSection);
      renderHistory();
      setStatus("idle", "待命");
      updateNavButtons();

      lookupBtn.addEventListener("click", () => lookup());
      backBtn.addEventListener("click", () => goBack());
      pasteBtn.addEventListener("click", () => pasteFromClipboard());
      deleteCharBtn.addEventListener("click", () => deletePreviousChar());
      clearInputBtn.addEventListener("click", () => clearInput());
      jumpLatinBtn.addEventListener("click", () => jumpToSection("latin"));
      jumpEnglishBtn.addEventListener("click", () => jumpToSection("en"));
      lookupLatinBtn.addEventListener("click", () => lookup(undefined, { section: "latin" }));
      lookupEnglishBtn.addEventListener("click", () => lookup(undefined, { section: "en" }));
      latinModeBtn.addEventListener("click", () => setActiveSection("latin"));
      englishModeBtn.addEventListener("click", () => setActiveSection("en"));

      wordInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          lookup();
        }
      });

      wikiFrame.addEventListener("load", () => {
        if (wikiFrame.src === "about:blank") {
          return;
        }

        if (pendingWord) {
          addToHistory({ word: pendingWord, section: pendingSection });
          setStatus("done", `完成：${pendingWord}（${getSectionLabel(pendingSection)}）`);
          pendingWord = null;
          return;
        }

        if (pendingFrameAction === "back") {
          pendingFrameAction = null;
          setStatus("done", "已返回上一頁");
          return;
        }

        if (pendingFrameAction === "section") {
          pendingFrameAction = null;
          setStatus("done", `已定位 ${getSectionLabel(activeSection)}`);
          return;
        }

        updateNavButtons();
      });

      clearHistoryBtn.addEventListener("click", () => {
        history = [];
        saveHistory(history);
        renderHistory();
      });

      runUrlLookup();

      function runUrlLookup() {
        const urlLookup = getUrlLookup();
        if (!urlLookup) return;
        setActiveSection(urlLookup.section);
        lookup(urlLookup.word, { updateUrl: false, section: urlLookup.section });
      }

      async function pasteFromClipboard() {
        if (lookupBtn.disabled) return;
        wordInput.value = "";
        wordInput.focus();

        if (!navigator.clipboard?.readText) {
          setStatus("error", "此環境不支援剪貼簿讀取（請手動貼上）");
          return;
        }

        try {
          const text = await navigator.clipboard.readText();
          wordInput.value = (text ?? "").trim();
          if (!wordInput.value) {
            setStatus("error", "剪貼簿沒有可用文字");
            return;
          }
          setStatus("idle", "已貼上");
        } catch {
          setStatus("error", "無法讀取剪貼簿（可能需要權限或 https/localhost）");
        }
      }

      function clearInput() {
        if (lookupBtn.disabled) return;
        wordInput.value = "";
        wordInput.focus();
        setStatus("idle", "已清除");
      }

      function deletePreviousChar() {
        if (lookupBtn.disabled) return;

        const value = wordInput.value;
        const start = wordInput.selectionStart ?? value.length;
        const end = wordInput.selectionEnd ?? value.length;

        if (start !== end) {
          wordInput.value = value.slice(0, start) + value.slice(end);
          wordInput.setSelectionRange(start, start);
        } else if (start > 0) {
          const before = Array.from(value.slice(0, start));
          before.pop();
          const nextStart = before.join("").length;
          wordInput.value = before.join("") + value.slice(start);
          wordInput.setSelectionRange(nextStart, nextStart);
        }

        wordInput.focus();
        setStatus("idle", "已刪除 1 個字元");
      }

      function goBack() {
        const current = wikiFrame?.src ?? "";
        if (!current || current === "about:blank") {
          setStatus("error", "尚未載入任何頁面");
          return;
        }

        pendingWord = null;
        pendingFrameAction = "back";
        setStatus("loading", "返回上一頁…");
        try {
          wikiFrame.contentWindow.history.back();
        } catch {
          window.history.back();
        }
      }

      function jumpToSection(section = activeSection) {
        const current = wikiFrame?.src ?? "";
        if (!current || current === "about:blank") {
          setStatus("error", "尚未載入任何頁面");
          return;
        }

        setActiveSection(section);
        pendingWord = null;
        pendingFrameAction = "section";
        setStatus("loading", `定位 ${getSectionLabel(section)}…`);

        try {
          forceFrameUrl(toSectionUrl(wikiFrame.contentWindow.location.href, section));
          return;
        } catch {
          // Cross-origin: fall back to resetting src with the requested section hash.
        }

        forceFrameUrl(toSectionUrl(current, section));
      }

      function getUrlLookup() {
        const query = getUrlQuery();
        const params = new URLSearchParams(query);
        const englishWord = params.get("en");
        if (englishWord?.trim()) {
          return { word: englishWord.trim(), section: "en" };
        }

        const latinWord = params.get("latin");
        if (latinWord?.trim()) {
          return { word: latinWord.trim(), section: "latin" };
        }

        const namedWord =
          params.get("q") ||
          params.get("keyword") ||
          params.get("keywork") ||
          params.get("word");

        if (namedWord?.trim()) {
          return { word: namedWord.trim(), section: getUrlSection(params) };
        }

        const rawQuery = query.replace(/^\?/, "");
        if (!rawQuery || rawQuery.includes("=")) return null;

        try {
          const word = decodeURIComponent(rawQuery.replace(/\+/g, " ")).trim();
          return word ? { word, section: "latin" } : null;
        } catch {
          const word = rawQuery.trim();
          return word ? { word, section: "latin" } : null;
        }
      }

      function getUrlQuery() {
        if (window.location.search) return window.location.search;

        const hash = window.location.hash || "";
        const hashQueryStart = hash.indexOf("?");
        if (hashQueryStart >= 0) return hash.slice(hashQueryStart);
        if (/^#(?:en|latin|q|keyword|keywork|word)=/i.test(hash)) return `?${hash.slice(1)}`;
        return "";
      }

      function getUrlSection(params = new URLSearchParams(getUrlQuery())) {
        return normalizeSection(params.get("section") || params.get("lang") || params.get("target") || "latin");
      }

      function updateUrlWord(word, section = activeSection) {
        const url = new URL(window.location.href);
        url.search = "";
        url.hash = "";
        url.searchParams.set(normalizeSection(section) === "en" ? "en" : "latin", word);
        window.history.replaceState({}, "", url);
      }

      function lookup(forcedWord, options = {}) {
        const shouldUpdateUrl = options.updateUrl !== false;
        const section = normalizeSection(options.section || activeSection);
        const word = (forcedWord ?? wordInput.value).trim();
        if (!word) {
          setStatus("error", "請輸入單字");
          wordInput.focus();
          return;
        }

        setActiveSection(section);
        pendingWord = word;
        pendingSection = section;
        wordInput.value = word;
        if (shouldUpdateUrl) {
          updateUrlWord(word, section);
        }

        const url = buildWiktionaryUrl(word, section);
        setStatus("loading", `查詢中：${word}（${getSectionLabel(section)}）`);
        forceFrameUrl(url);
      }

      function buildWiktionaryUrl(word, section = activeSection) {
        const hash = getSectionHash(section);
        return `https://en.wiktionary.org/wiki/${encodeURIComponent(word)}#${hash}`;
      }

      function toSectionUrl(current, section = activeSection) {
        const hash = getSectionHash(section);
        try {
          const url = new URL(current);
          url.hash = hash;
          return url.toString();
        } catch {
          return `${current.split("#")[0]}#${hash}`;
        }
      }

      function normalizeSection(section) {
        const value = String(section || "").trim().toLowerCase();
        if (value === "en" || value === "eng" || value === "english") return "en";
        return "latin";
      }

      function getSectionHash(section) {
        return SECTION_TARGETS[normalizeSection(section)].hash;
      }

      function getSectionLabel(section) {
        return SECTION_TARGETS[normalizeSection(section)].label;
      }

      function setActiveSection(section) {
        activeSection = normalizeSection(section);
        latinModeBtn.setAttribute("aria-pressed", String(activeSection === "latin"));
        englishModeBtn.setAttribute("aria-pressed", String(activeSection === "en"));
        lookupBtn.textContent = `查詢 ${getSectionLabel(activeSection)}`;
      }

      function forceFrameUrl(url) {
        if (wikiFrame.src === url) {
          wikiFrame.src = "about:blank";
        }

        wikiFrame.src = url;
      }

      function setStatus(variant, text) {
        statusEl.dataset.variant = variant;
        statusText.textContent = text;
        const isLoading = variant === "loading";
        spinner.hidden = !isLoading;
        overlay.hidden = !isLoading;
        overlayText.textContent = isLoading ? text : "查詢中…";
        lookupBtn.disabled = isLoading;
        wordInput.disabled = isLoading;
        backBtn.disabled = isLoading;
        pasteBtn.disabled = isLoading;
        deleteCharBtn.disabled = isLoading;
        clearInputBtn.disabled = isLoading;
        jumpLatinBtn.disabled = isLoading;
        jumpEnglishBtn.disabled = isLoading;
        lookupLatinBtn.disabled = isLoading;
        lookupEnglishBtn.disabled = isLoading;
        latinModeBtn.disabled = isLoading;
        englishModeBtn.disabled = isLoading;
        if (!isLoading) updateNavButtons();
      }

      function updateNavButtons() {
        const current = wikiFrame?.src ?? "";
        const hasPage = Boolean(current && current !== "about:blank");
        backBtn.disabled = !hasPage;
        jumpLatinBtn.disabled = !hasPage;
        jumpEnglishBtn.disabled = !hasPage;
      }

      function loadHistory() {
        try {
          const raw = localStorage.getItem(HISTORY_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          if (!Array.isArray(parsed)) return [];
          return parsed
            .map(normalizeHistoryItem)
            .filter(Boolean)
            .slice(0, HISTORY_MAX);
        } catch {
          return [];
        }
      }

      function saveHistory(nextHistory) {
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(nextHistory));
        } catch {
          // Ignore storage errors (private mode, quota, etc.)
        }
      }

      function normalizeHistoryItem(item) {
        if (typeof item === "string") {
          const word = item.trim();
          return word ? { word, section: "latin" } : null;
        }
        if (!item || typeof item !== "object") return null;
        const word = String(item.word || "").trim();
        if (!word) return null;
        return { word, section: normalizeSection(item.section) };
      }

      function getHistoryKey(item) {
        return `${item.section}:${item.word.toLowerCase()}`;
      }

      function addToHistory(item) {
        const normalized = normalizeHistoryItem(item);
        if (!normalized) return;
        const currentKey = getHistoryKey(normalized);
        const next = [normalized, ...history.filter((x) => getHistoryKey(x) !== currentKey)].slice(0, HISTORY_MAX);
        history = next;
        saveHistory(history);
        renderHistory();
      }

      function renderHistory() {
        historyList.innerHTML = "";

        if (history.length === 0) {
          const empty = document.createElement("div");
          empty.className = "history-empty";
          empty.textContent = "目前沒有紀錄";
          historyList.appendChild(empty);
          clearHistoryBtn.disabled = true;
          return;
        }

        clearHistoryBtn.disabled = false;
        for (const item of history) {
          const li = document.createElement("li");
          li.className = "history-item";

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "history-btn";
          btn.textContent = item.word;
          btn.addEventListener("click", () => lookup(item.word, { section: item.section }));

          const badge = document.createElement("span");
          badge.className = "history-lang";
          badge.textContent = getSectionLabel(item.section);

          li.appendChild(btn);
          li.appendChild(badge);
          historyList.appendChild(li);
        }
      }
    </script>
  </body>
</html>
