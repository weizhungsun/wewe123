<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>拉丁文 Wiktionary 查詢工具</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    input[type="text"] {
      width: 300px;
      padding: 8px;
      font-size: 16px;
    }
    button {
      padding: 8px 16px;
      font-size: 16px;
    }
    iframe {
      width: 100%;
      height: 80vh;
      margin-top: 20px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h2>拉丁字 Wiktionary 查詢</h2>
  <input type="text" id="wordInput" placeholder="輸入拉丁字...">
  <button onclick="lookup()">查詢</button>
  <iframe id="wikiFrame"></iframe>

  <script>
    const wordInput = document.getElementById("wordInput");
    const wikiFrame = document.getElementById("wikiFrame");

    function getUrlWord() {
      const params = new URLSearchParams(window.location.search);
      return (
        params.get("q") ||
        params.get("keyword") ||
        params.get("word") ||
        ""
      ).trim();
    }

    function showWord(word) {
      if (word) {
        const url = `https://en.wiktionary.org/wiki/${encodeURIComponent(word)}#Latin`;
        wikiFrame.src = url;
      }
    }

    function lookup() {
      const word = wordInput.value.trim();
      if (word) {
        const url = new URL(window.location.href);
        url.searchParams.set("q", word);
        window.history.replaceState({}, "", url);
        showWord(word);
      }
    }

    wordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        lookup();
      }
    });

    const urlWord = getUrlWord();
    if (urlWord) {
      wordInput.value = urlWord;
      showWord(urlWord);
    }
  </script>
</body>
</html>
