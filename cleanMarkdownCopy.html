<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown 清理工具</title>
  <style>
    :root { color-scheme:light; --ink:#202b3d; --muted:#68758a; --line:#dde3eb; --accent:#2459d3; --soft:#eef3ff; }
    * { box-sizing:border-box; }
    body { margin:0; padding:32px; background:#f5f6f8; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif; line-height:1.6; }
    button,textarea,input { font:inherit; }
    button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
    button:focus-visible,textarea:focus-visible,input:focus-visible { outline:3px solid #94b4ff; outline-offset:3px; }
    .app { max-width:1440px; margin:0 auto; }
    .page-header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:24px; }
    h1 { font-size:25px; line-height:1.3; letter-spacing:-.03em; margin:0 0 6px; }
    .page-header p,.section-caption { margin:0; color:var(--muted); font-size:13px; }
    .utility-actions,.action-buttons { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .button { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:34px; padding:6px 11px; border:1px solid var(--line); border-radius:9px; background:white; color:var(--ink); font-size:13px; font-weight:600; line-height:1.4; transition:background 120ms,border-color 120ms; }
    .button:hover { background:#f0f3f8; border-color:#b8c4d5; }
    .button[aria-expanded="true"] { background:var(--soft); border-color:#b9cafd; color:var(--accent); }
    .button-primary { background:var(--accent); border-color:var(--accent); color:white; }
    .button-primary:hover { background:#1b47b0; border-color:#1b47b0; }
    .icon { width:15px; height:15px; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .controls { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px 20px; border:1px solid var(--line); border-radius:10px; background:white; padding:12px 14px; margin-bottom:16px; }
    .mode-selector { display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-width:0; }
    .mode-selector h2 { font-size:12px; color:var(--muted); margin:0; font-weight:500; }
    .mode-grid { display:flex; flex-wrap:wrap; gap:6px; }
    .mode-button { min-height:34px; padding:6px 12px; border:1px solid var(--line); border-radius:7px; background:white; color:var(--ink); font-size:13px; font-weight:500; line-height:1.5; transition:background 120ms,border-color 120ms; }
    .mode-button:hover { border-color:#a8bce8; background:#fafbff; }
    .mode-button[aria-pressed="true"] { border-color:var(--accent); background:var(--soft); color:var(--accent); font-weight:600; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }
    .help-panel,.options-panel { display:none; padding:20px; margin:0 0 20px; border:1px solid var(--line); border-radius:12px; background:white; position:relative; }
    .help-panel.open,.options-panel.open { display:block; }
    .help-panel h3,.options-panel h3 { margin:0 48px 16px 0; font-size:16px; }
    .close { position:absolute; right:12px; top:12px; min-width:36px; min-height:36px; border:0; border-radius:8px; color:var(--muted); background:#f2f4f7; }
    .close:hover { color:var(--ink); background:#e8ecf2; }
    .help-panel .section { margin:14px 0; font-size:14px; }
    .help-panel p { margin:5px 0; color:var(--muted); }
    .help-panel ul { margin:6px 0; padding-left:22px; color:var(--muted); }
    .options-panel .row { display:flex; align-items:flex-start; gap:10px; margin:14px 0; font-size:14px; }
    .options-panel .row input { margin:5px 0 0; accent-color:var(--accent); }
    .options-panel label { cursor:pointer; }
    .summary { background:#f7f8fb; border:1px solid #edf0f4; border-radius:8px; padding:10px 14px; font-size:13px; }
    #optionsSummary { color:var(--muted); }
    .editor-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; }
    .editor { min-width:0; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:white; }
    .editor-header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 18px; border-bottom:1px solid #edf0f4; }
    .editor-header label { font-size:14px; font-weight:650; }
    .editor-tag { font-size:11px; color:var(--muted); letter-spacing:.07em; }
    textarea { display:block; width:100%; height:440px; min-height:240px; padding:18px; border:0; border-radius:0; resize:vertical; color:var(--ink); background:white; font-family:"SFMono-Regular",Consolas,"Microsoft JhengHei",monospace; font-size:14px; line-height:1.75; tab-size:4; }
    textarea::placeholder { color:#9aa5b5; }
    textarea:focus-visible { outline-offset:-3px; }
    #outputText { background:#fcfdff; }
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); max-width:calc(100vw - 32px); padding:12px 20px; border-radius:10px; color:white; background:#26344b; font-size:14px; box-shadow:0 8px 24px #1c2a4426; z-index:100; }
    @media (max-width:900px) {
      body { padding:24px; }
      .editor-grid { grid-template-columns:1fr; }
      textarea { height:320px; }
    }
    @media (max-width:600px) {
      body { padding:18px 14px; }
      .page-header { align-items:flex-start; flex-direction:column; gap:10px; margin-bottom:14px; }
      h1 { font-size:21px; }
      .controls { padding:10px; gap:10px; }
      .mode-selector { gap:7px; }
      .mode-selector h2 { width:100%; }
      .mode-button { min-height:36px; padding:6px 10px; }
      .button { min-height:36px; }
      .help-panel,.options-panel { padding:16px; }
      .editor-header { padding:12px 14px; }
      textarea { padding:14px; }
    }
    @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="page-header">
      <div>
        <h1>Markdown 清理工具</h1>
        <p>整理多餘空白，保留內容結構。</p>
      </div>
      <div class="utility-actions" aria-label="工具設定與說明">
        <button class="button" type="button" aria-expanded="false" aria-controls="optionsPanel" id="optionsToggle">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg>清理選項
        </button>
        <button class="button" type="button" aria-expanded="false" aria-controls="helpPanel" id="helpToggle">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4M12 17h.01"/></svg>使用說明
        </button>
      </div>
    </header>
    <section class="controls" aria-labelledby="modeHeading">
      <div class="mode-selector">
        <h2 id="modeHeading">清理模式</h2>
        <div class="mode-grid" role="group" aria-labelledby="modeHeading">
          <button class="mode-button" id="modeClean1" type="button" aria-pressed="true" onclick="cleanText()">清理格式</button>
          <button class="mode-button" id="modeClean2" type="button" aria-pressed="false" onclick="cleanText2()">清理格式2</button>
          <button class="mode-button" id="modePreserve" type="button" aria-pressed="false" onclick="cleanTextPreserveMarkdown()">保留 Markdown</button>
        </div>
      </div>
      <div class="action-buttons">
        <button class="button button-primary" type="button" onclick="cleanAndCopy()">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m13 2-9 12h7l-1 8 10-12h-7l1-8Z"/></svg>清理並複製
        </button>
        <button class="button" type="button" onclick="copyOutput()">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>複製結果
        </button>
      </div>
      <p class="sr-only" aria-live="polite">目前模式：<strong id="currentMode">清理格式</strong></p>
    </section>

  <aside class="help-panel" id="helpPanel" role="dialog" aria-modal="false" aria-labelledby="helpTitle">
    <button class="close" type="button" aria-label="關閉使用說明" id="helpClose">✕</button>
    <h3 id="helpTitle">使用說明</h3>
    <div class="section">
      <strong>清理格式｜筆記整理</strong>
      <p id="helpClean1"></p>
    </div>
    <div class="section">
      <strong>清理格式2｜文字化輸出</strong>
      <p id="helpClean2"></p>
    </div>
    <div class="section">
      <strong>保留 Markdown</strong>
      <p id="helpPreserve"></p>
    </div>
    <div class="section">
      <strong>操作提示</strong>
      <ul>
        <li>點選任一模式會立即清理；選取中的模式會以藍色標示。滑鼠停留在模式按鈕可查看詳細說明。</li>
        <li>「清理並複製」會依目前模式重新清理；「複製結果」只複製輸出內容。清理選項與使用說明可用 Esc 關閉。</li>
      </ul>
    </div>
  </aside>

  <aside class="options-panel" id="optionsPanel" role="dialog" aria-modal="false" aria-labelledby="optionsTitle">
    <button class="close" type="button" aria-label="關閉清理選項" id="optionsClose">✕</button>
    <h3 id="optionsTitle">清理選項</h3>
    <div class="summary" id="optionsModeLabel"></div>

    <div id="optionsGroupClean1">
      <div class="row">
        <input type="checkbox" id="optPromoteHeadings" checked>
        <label for="optPromoteHeadings">標題層級提升到 H1（例如 ##→#、###→##）</label>
      </div>
      <div class="row">
        <input type="checkbox" id="optNormalizeLists" checked>
        <label for="optNormalizeLists">列表符號統一（• / * / + → -；保留原縮排）</label>
      </div>
      <div class="row">
        <input type="checkbox" id="optTableSpacing" checked>
        <label for="optTableSpacing">表格前保留一行必要空白（結尾間距自動保護）</label>
      </div>
      <div class="row">
        <input type="checkbox" id="optHrSpacing" checked>
        <label for="optHrSpacing">保留 <code>---</code> 必要間距，避免誤判為標題</label>
      </div>
      <div class="row">
        <input type="checkbox" id="optRemoveBold" checked>
        <label for="optRemoveBold">移除 <code>**</code>（粗體標記）</label>
      </div>
    </div>

    <div id="optionsGroupClean2" style="display:none">
      <div class="row">
        <input type="checkbox" id="opt2RemoveBlankLines" checked>
        <label for="opt2RemoveBlankLines">盡量移除空白行（只保留必要的 Markdown 間距）</label>
      </div>
      <div class="row">
        <input type="checkbox" id="opt2NormalizeLists" checked>
        <label for="opt2NormalizeLists">列表符號統一（• / * / + → -；保留原縮排）</label>
      </div>
      <div class="row">
        <input type="checkbox" id="opt2TableSpacing" checked>
        <label for="opt2TableSpacing">表格前保留一行必要空白（結尾間距自動保護）</label>
      </div>
      <div class="row">
        <input type="checkbox" id="opt2HrToSymbol" checked>
        <label for="opt2HrToSymbol">將分隔線 <code>---</code> 轉為 <code>⸻</code></label>
      </div>
      <div class="row">
        <input type="checkbox" id="opt2RemoveBold" checked>
        <label for="opt2RemoveBold">移除 <code>**</code>（粗體標記）</label>
      </div>
    </div>

    <div id="optionsGroupPreserve" style="display:none">
      <div class="row">
        <input type="checkbox" id="optPreserveRemoveBlankLines" checked>
        <label for="optPreserveRemoveBlankLines">盡量移除空白行（只保留必要的 Markdown 間距）</label>
      </div>
      <div class="row">
        <input type="checkbox" id="optPreserveRemoveBold" checked>
        <label for="optPreserveRemoveBold">移除 <code>**</code>（粗體標記）</label>
      </div>
    </div>

    <div class="summary" id="optionsSummary"></div>
  </aside>

    <section class="editor-grid" aria-label="Markdown 輸入與輸出">
      <div class="editor">
        <div class="editor-header">
          <label for="inputText">輸入內容</label>
          <span class="editor-tag" aria-hidden="true">INPUT</span>
        </div>
        <textarea id="inputText" placeholder="在這裡貼上 Markdown 內容…" spellcheck="false"></textarea>
      </div>
      <div class="editor">
        <div class="editor-header">
          <label for="outputText">清理結果</label>
          <span class="editor-tag" aria-hidden="true">OUTPUT · 唯讀</span>
        </div>
        <textarea id="outputText" placeholder="清理後的內容會顯示在這裡" readonly spellcheck="false"></textarea>
      </div>
    </section>
  </main>

  <script>
    const HELP_TEXT = {
      clean1: "預設盡量移除空白行與 ** 粗體標記；表格前保留一行空白，其餘只保留避免 Markdown 解析錯誤的間距。提升標題層級、統一列表符號。程式碼內容、雙空格換行與 emoji 保留。",
      clean2: "預設盡量移除空白行與 ** 粗體標記，可在清理選項取消；移除 H1–H3 的 #，將 --- 分隔線改成 ⸻。表格前保留一行空白，保護程式碼與 Setext 標題底線。",
      preserve: "保留標題與列表縮排，預設盡量移除空白行與 ** 粗體標記，可在清理選項取消；不保留一般段落間距。表格前與必要的區塊邊界仍保留空行。程式碼、HTML、YAML frontmatter 與數學區塊內部內容保留。"
    };

    function syncHelpText() {
      const tip1 = document.getElementById('modeClean1');
      const tip2 = document.getElementById('modeClean2');
      const tipPreserve = document.getElementById('modePreserve');
      const h1 = document.getElementById('helpClean1');
      const h2 = document.getElementById('helpClean2');
      const hPreserve = document.getElementById('helpPreserve');

      if (tip1) tip1.title = HELP_TEXT.clean1;
      if (tip2) tip2.title = HELP_TEXT.clean2;
      if (tipPreserve) tipPreserve.title = HELP_TEXT.preserve;
      if (h1) h1.textContent = HELP_TEXT.clean1;
      if (h2) h2.textContent = HELP_TEXT.clean2;
      if (hPreserve) hPreserve.textContent = HELP_TEXT.preserve;
    }
    syncHelpText();

    let activeFormat = 'clean1';

    function normalizeInputText(text) {
      return text.replace(/\r\n?/g, '\n').replace(/^\uFEFF/, '');
    }

    function cleanOutsideCodeLine(line) {
      // ZWJ / ZWNJ may be meaningful text; two trailing spaces mean a hard break.
      const hardBreak = / {2,}$/.test(line) && line.trim() !== '';
      return line
        .replace(/[\uFEFF\u200B]/g, '')
        .replace(/[\u00A0\u3000]/g, ' ')
        .replace(/[ \t]+$/, hardBreak ? '  ' : '');
    }

    function matchListLine(line) {
      return line.match(/^( {0,3})(\d{1,9}[.)]|[-*+\u2022])[ \t]+(.*)$/);
    }

    function isHeadingLine(line) {
      return /^ {0,3}#{1,6}(?:[ \t]+|$)/.test(line);
    }

    function isHrLine(line) {
      return /^ {0,3}(?:(?:\*[ \t]*){3,}|(?:-[ \t]*){3,}|(?:_[ \t]*){3,})$/.test(line) ||
        line.trim() === '⸻';
    }

    function openingFence(line) {
      const quote = line.match(/^ {0,3}(?:>[ \t]?)+/);
      let content = quote ? line.slice(quote[0].length) : line;
      const list = content.match(/^ {0,3}(?:[-*+]|\d{1,9}[.)])[ \t]+/);
      if (list) content = content.slice(list[0].length);
      const match = content.match(/^ {0,3}(\x60{3,}|~{3,})(.*)$/);
      if (!match || (match[1][0] === '\x60' && match[2].includes('\x60'))) return null;
      return {
        marker: match[1][0], length: match[1].length,
        quoteDepth: quote ? (quote[0].match(/>/g) || []).length : 0,
        listIndent: list ? list[0].length : 0
      };
    }

    function closingFence(line, fence) {
      let content = line;
      for (let i = 0; i < fence.quoteDepth; i++) {
        const quote = content.match(/^ {0,3}>[ \t]?/);
        if (!quote) return false;
        content = content.slice(quote[0].length);
      }
      if (fence.listIndent) {
        if (!content.startsWith(' '.repeat(fence.listIndent))) return false;
        content = content.slice(fence.listIndent);
      }
      const match = content.match(/^ {0,3}(\x60+|~+)[ \t]*$/);
      return Boolean(match && match[1][0] === fence.marker && match[1].length >= fence.length);
    }

    function tableCells(line) {
      let text = line.trim();
      if (!text.includes('|')) return null;
      if (text.startsWith('|')) text = text.slice(1);
      // Only unescaped trailing pipes are optional table borders.
      if (/(?<!\\)(?:\\\\)*\|$/.test(text)) text = text.slice(0, -1);
      const cells = [];
      let cell = '';
      for (let i = 0; i < text.length; i++) {
        if (text[i] === '\\' && i + 1 < text.length) {
          cell += text[i] + text[++i];
        } else if (text[i] === '|') {
          cells.push(cell.trim());
          cell = '';
        } else {
          cell += text[i];
        }
      }
      cells.push(cell.trim());
      return cells;
    }

    function isTableStart(lines, index) {
      if (!lines[index + 1] || /^ {4}|^\t/.test(lines[index])) return false;
      const header = tableCells(lines[index]);
      const delimiter = tableCells(cleanOutsideCodeLine(lines[index + 1]));
      return Boolean(header && delimiter && header.length === delimiter.length &&
        delimiter.every(cell => /^:?-+:?$/.test(cell)));
    }

    function htmlBlockEnd(line) {
      const trimmed = line.trimStart();
      if (trimmed.startsWith('<!--')) return /-->/;
      const rawTag = trimmed.match(/^<(script|pre|style|textarea)(?:\s|>|$)/i);
      if (rawTag) return new RegExp('</' + rawTag[1] + '\\s*>', 'i');
      if (/^<\?/.test(trimmed)) return /\?>/;
      if (/^<!\[CDATA\[/.test(trimmed)) return /\]\]>/;
      if (/^<![A-Z]/.test(trimmed)) return />/;
      // These HTML blocks end at a blank line in Markdown.
      if (/^<\/?(?:address|article|aside|base|blockquote|body|caption|center|col|colgroup|dd|details|dialog|dir|div|dl|dt|fieldset|figcaption|figure|footer|form|frame|frameset|h[1-6]|head|header|hr|html|iframe|legend|li|link|main|menu|menuitem|nav|ol|optgroup|option|p|param|search|section|summary|table|tbody|td|tfoot|th|thead|title|tr|track|ul)(?:\s|\/?>|$)/i.test(trimmed)) return 'blank';
      return null;
    }

    function scanMarkdownBlocks(lines) {
      const blocks = [];
      for (let i = 0; i < lines.length; i++) {
        const start = i;
        // Normalize only the current unprotected line before classifying it.
        // Once a protected block opens, its remaining source lines stay untouched.
        const line = cleanOutsideCodeLine(lines[i]);
        const fence = openingFence(line);
        if (i === 0 && line === '---') {
          const end = lines.findIndex((value, index) => index > 0 && /^(---|\.\.\.)$/.test(value));
          if (end > 0) {
            blocks.push({ kind: 'protected', lines: lines.slice(0, end + 1) });
            i = end;
            continue;
          }
        }
        if (fence) {
          while (++i < lines.length && !closingFence(lines[i], fence)) {}
          blocks.push({ kind: 'protected', lines: lines.slice(start, Math.min(i + 1, lines.length)) });
          continue;
        }
        // Common math extensions use standalone $$ delimiters; keep their content intact.
        if (/^ {0,3}\$\$[ \t]*$/.test(line)) {
          while (++i < lines.length && !/^ {0,3}\$\$[ \t]*$/.test(lines[i])) {}
          blocks.push({ kind: 'protected', lines: lines.slice(start, Math.min(i + 1, lines.length)) });
          continue;
        }
        // Indented content may be code or a nested list continuation. Do not rewrite it.
        if (/^( {4}|\t)/.test(line)) {
          while (i + 1 < lines.length) {
            if (/^( {4}|\t)/.test(lines[i + 1])) {
              i++;
              continue;
            }
            let next = i + 1;
            while (next < lines.length && lines[next].trim() === '') next++;
            if (next > i + 1 && /^( {4}|\t)/.test(lines[next] || '')) i = next;
            else break;
          }
          blocks.push({ kind: 'indented', lines: lines.slice(start, i + 1) });
          continue;
        }
        const htmlEnd = htmlBlockEnd(line);
        if (htmlEnd) {
          if (htmlEnd === 'blank') {
            while (i + 1 < lines.length && lines[i + 1].trim() !== '') i++;
          } else {
            while (!htmlEnd.test(lines[i]) && i + 1 < lines.length) i++;
          }
          blocks.push({ kind: 'protected', htmlNeedsBlank: htmlEnd === 'blank', lines: lines.slice(start, i + 1) });
          continue;
        }
        lines[i] = line;
        if (isTableStart(lines, i)) {
          i++;
          while (i + 1 < lines.length && lines[i + 1].trim() !== '' &&
            tableCells(lines[i + 1]) && !isHeadingLine(lines[i + 1]) &&
            !matchListLine(lines[i + 1]) && !/^ {0,3}>/.test(lines[i + 1]) &&
            !openingFence(lines[i + 1]) && !isHrLine(lines[i + 1])) i++;
          blocks.push({ kind: 'table', lines: lines.slice(start, i + 1) });
          continue;
        }
        if (line.trim() === '') {
          blocks.push({ kind: 'blank', lines: [''] });
          continue;
        }
        const kind = isHeadingLine(line) ? 'heading' :
          isHrLine(line) ? 'hr' :
          matchListLine(line) ? 'list' :
          /^ {0,3}>/.test(line) ? 'quote' : 'paragraph';
        // Setext heading underlines must not become thematic breaks.
        if (kind === 'paragraph' && /^ {0,3}(?:=+|-+)[ \t]*$/.test(lines[i + 1] || '')) {
          const preceding = [];
          while (blocks.length && blocks[blocks.length - 1].kind === 'paragraph') {
            preceding.push(blocks.pop().lines[0]);
          }
          blocks.push({ kind: 'setext', lines: preceding.reverse().concat(lines.slice(i, i + 2)) });
          i++;
        } else {
          blocks.push({ kind, lines: [line] });
        }
      }
      return blocks;
    }

    function cleanCore(options, source = document.getElementById('inputText').value) {
      const blocks = scanMarkdownBlocks(normalizeInputText(source).split('\n'));
      let headingShift = 0;
      if (options.promoteHeadings) {
        const levels = blocks.filter(block => block.kind === 'heading')
          .map(block => block.lines[0].trimStart().match(/^#+/)[0].length);
        if (levels.length) headingShift = Math.max(0, levels.reduce((min, level) => Math.min(min, level), 6) - 1);
      }
      const output = [];
      let previous = null;
      let pendingBlanks = 0;
      function addBlank() {
        if (output.length && output[output.length - 1] !== '') output.push('');
      }
      for (const block of blocks) {
        if (block.kind === 'blank') {
          pendingBlanks++;
          continue;
        }
        if (block.kind === 'paragraph' && options.removeBoldMarkers &&
            removeBoldOutsideCode(cleanOutsideCodeLine(block.lines[0])).trim() === '') continue;
        if (previous) {
          // Compression deliberately joins ordinary paragraphs and tightens loose lists.
          if (pendingBlanks && !options.removeBlankLines) {
            for (let j = 0; j < pendingBlanks; j++) output.push('');
          }
          if (options.markdownBlockSpacing) {
            const previousIsText = previous.kind === 'paragraph' ||
              (previous.kind === 'heading' && options.stripHeadingMarkersUpTo &&
                previous.lines[0].trimStart().match(/^#+/)[0].length <= options.stripHeadingMarkersUpTo);
            const hyphenHr = block.kind === 'hr' && /^ {0,3}-{3,}[ \t]*$/.test(block.lines[0]);
            const ordered = block.kind === 'list' && block.lines[0].trimStart().match(/^(\d+)[.)]/);
            const previousIndented = /^(?: +|\t)\S/.test(previous.lines[previous.lines.length - 1]);
            const nextIndented = /^(?: +|\t)\S/.test(block.lines[0]);
            const needed =
              (block.kind === 'table' && options.tableSpacing) ||
              // Even text without pipes can become an extra table row in GFM renderers.
              previous.kind === 'table' ||
              // Without a blank, --- and preceding text become a Setext heading.
              (hyphenHr && !options.hrToSymbol && previousIsText && options.hrAddSpacing) ||
              (block.kind === 'setext' && previousIsText) ||
              // An ordered list starting above 1 cannot interrupt a paragraph.
              (ordered && ordered[1] !== '1' && previousIsText) ||
              previous.htmlNeedsBlank ||
              (pendingBlanks > 0 && (
                block.kind === 'indented' || previous.kind === 'indented' ||
                (block.kind === 'paragraph' && nextIndented) ||
                (block.kind === 'paragraph' && previous.kind !== 'list' &&
                  (previous.kind === 'quote' || previousIndented)) ||
                (block.kind === 'quote' && previous.kind === 'quote')
              ));
            if (needed) addBlank();
          }
        }
        pendingBlanks = 0;
        let rendered = block.lines;
        if (!['protected', 'indented'].includes(block.kind)) {
          rendered = block.lines.map(line => {
            let result = cleanOutsideCodeLine(line);
            if (block.kind === 'heading') {
              const match = result.match(/^( {0,3})(#{1,6})(?:[ \t]+(.*)|$)/);
              if (match && options.stripHeadingMarkersUpTo && match[2].length <= options.stripHeadingMarkersUpTo) {
                result = match[1] + (match[3] || '');
              } else if (match && options.promoteHeadings) {
                result = match[1] + '#'.repeat(Math.max(1, match[2].length - headingShift)) + ' ' + (match[3] || '');
              }
            }
            if (block.kind === 'list' && options.normalizeLists) {
              result = result.replace(/^( {0,3})[*+\u2022]([ \t]+)/, '$1-$2');
            }
            if (block.kind === 'hr' && options.hrToSymbol && /^ {0,3}-{3,}[ \t]*$/.test(result)) result = '⸻';
            // Bold formatting is removed by default, including cells; inline code stays literal.
            if (options.removeBoldMarkers) {
              result = removeBoldOutsideCode(result);
            }
            return result;
          });
        }
        output.push(...rendered);
        previous = block;
      }
      return output.join('\n');
    }

    function removeBoldOutsideCode(line) {
      let result = '';
      for (let i = 0; i < line.length;) {
        if (line[i] === '\\' && i + 1 < line.length) {
          result += line.slice(i, i + 2);
          i += 2;
        } else if (line[i] === '\x60') {
          const marker = line.slice(i).match(/^\x60+/)[0];
          let end = i + marker.length;
          while ((end = line.indexOf(marker, end)) !== -1 &&
            (line[end - 1] === '\x60' || line[end + marker.length] === '\x60')) end += marker.length;
          if (end === -1) {
            result += marker;
            i += marker.length;
          } else {
            result += line.slice(i, end + marker.length);
            i = end + marker.length;
          }
        } else if (line.slice(i, i + 2) === '**') {
          i += 2;
        } else {
          result += line[i++];
        }
      }
      return result;
    }

    function setActiveFormat(format) {
      activeFormat = format;
      for (const [id, value] of [['modeClean1', 'clean1'], ['modeClean2', 'clean2'], ['modePreserve', 'preserve']]) {
        document.getElementById(id)?.setAttribute('aria-pressed', String(format === value));
      }
      const currentMode = document.getElementById('currentMode');
      if (currentMode) currentMode.textContent =
        format === 'clean1' ? '清理格式' : format === 'clean2' ? '清理格式2' : '保留 Markdown';

      const label = document.getElementById('optionsModeLabel');
      const groupClean1 = document.getElementById('optionsGroupClean1');
      const groupClean2 = document.getElementById('optionsGroupClean2');
      const groupPreserve = document.getElementById('optionsGroupPreserve');

      if (groupClean1) groupClean1.style.display = format === 'clean1' ? '' : 'none';
      if (groupClean2) groupClean2.style.display = format === 'clean2' ? '' : 'none';
      if (groupPreserve) groupPreserve.style.display = format === 'preserve' ? '' : 'none';

      if (label) {
        const name =
          format === 'clean1' ? '清理格式' :
          format === 'clean2' ? '清理格式2' :
          '保留 Markdown';
        label.innerHTML = `<strong>目前模式：</strong> ${name}`;
      }

      updateOptionsSummary();
    }

    function getCleanOptionsFromUI(format) {
      if (format === 'preserve') {
        return {
          promoteHeadings: false,
          normalizeLists: false,
          tableSpacing: true,
          hrAddSpacing: true,
          hrToSymbol: false,
          stripHeadingMarkersUpTo: 0,
          removeBlankLines: document.getElementById('optPreserveRemoveBlankLines')?.checked ?? true,
          removeBoldMarkers: document.getElementById('optPreserveRemoveBold')?.checked ?? true,
          markdownBlockSpacing: document.getElementById('optPreserveRemoveBlankLines')?.checked ?? true
        };
      }

      if (format === 'clean2') {
        const removeBlankLines = document.getElementById('opt2RemoveBlankLines')?.checked ?? true;
        const normalizeLists = document.getElementById('opt2NormalizeLists')?.checked ?? true;
        const tableSpacing = document.getElementById('opt2TableSpacing')?.checked ?? true;
        const hrToSymbol = document.getElementById('opt2HrToSymbol')?.checked ?? true;
        const removeBoldMarkers = document.getElementById('opt2RemoveBold')?.checked ?? true;

        return {
          promoteHeadings: false,
          normalizeLists,
          tableSpacing,
          hrAddSpacing: false,
          hrToSymbol,
          stripHeadingMarkersUpTo: 3,
          removeBlankLines,
          removeBoldMarkers,
          markdownBlockSpacing: true
        };
      }

      const promoteHeadings = document.getElementById('optPromoteHeadings')?.checked ?? true;
      const normalizeLists = document.getElementById('optNormalizeLists')?.checked ?? true;
      const tableSpacing = document.getElementById('optTableSpacing')?.checked ?? true;
      const hrAddSpacing = document.getElementById('optHrSpacing')?.checked ?? true;
      const removeBoldMarkers = document.getElementById('optRemoveBold')?.checked ?? true;

      return {
        promoteHeadings,
        normalizeLists,
        tableSpacing,
        hrAddSpacing,
        hrToSymbol: false,
        stripHeadingMarkersUpTo: 0,
        removeBlankLines: true,
        removeBoldMarkers,
        markdownBlockSpacing: true
      };
    }

    function updateOptionsSummary() {
      const summary = document.getElementById('optionsSummary');
      if (!summary) return;

      const enabled = [];
      if (activeFormat === 'clean1') {
        enabled.push('盡量移除空白行');
        if (document.getElementById('optPromoteHeadings')?.checked) enabled.push('標題提升到 H1');
        if (document.getElementById('optNormalizeLists')?.checked) enabled.push('列表符號統一（保留縮排）');
        if (document.getElementById('optTableSpacing')?.checked) enabled.push('表格前保留必要空行');
        if (document.getElementById('optHrSpacing')?.checked) enabled.push('分隔線前補空白行');
        if (document.getElementById('optRemoveBold')?.checked) enabled.push('移除 **');
      } else if (activeFormat === 'clean2') {
        enabled.push('H1–H3 去除 #（保留文字）');
        if (document.getElementById('opt2RemoveBlankLines')?.checked) enabled.push('盡量移除空白行');
        if (document.getElementById('opt2NormalizeLists')?.checked) enabled.push('列表符號統一（保留縮排）');
        if (document.getElementById('opt2TableSpacing')?.checked) enabled.push('表格前保留必要空行');
        if (document.getElementById('opt2HrToSymbol')?.checked) enabled.push('--- → ⸻');
        if (document.getElementById('opt2RemoveBold')?.checked) enabled.push('移除 **');
      } else if (activeFormat === 'preserve') {
        enabled.push('保留 markdown 結構');
        if (document.getElementById('optPreserveRemoveBlankLines')?.checked) enabled.push('盡量移除空白行');
        if (document.getElementById('optPreserveRemoveBold')?.checked) enabled.push('移除 **');
        enabled.push('不改 H1/H2/# 標記');
        enabled.push('保留表格結構 / code block / 列表縮排');
      }

      summary.innerHTML = `<strong>目前勾選：</strong><br>${enabled.length ? enabled.map(s => `• ${s}`).join('<br>') : '（無）'}`;
    }
    setActiveFormat(activeFormat);

    // ===== 原本清理格式 =====
    function cleanText() {
      setActiveFormat('clean1');
      const cleaned = cleanCore(getCleanOptionsFromUI('clean1'));
      document.getElementById('outputText').value = cleaned;
    }
    // ===== 新增清理格式2 =====
    function cleanText2() {
        setActiveFormat('clean2');
        document.getElementById('outputText').value = cleanCore(getCleanOptionsFromUI('clean2'));
    }

    function cleanTextPreserveMarkdown() {
      setActiveFormat('preserve');
      document.getElementById('outputText').value = cleanCore(getCleanOptionsFromUI('preserve'));
    }

    function showToast(message) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.setAttribute("role", "status");
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 1500);
    }

    // ===== 複製輸出 =====
    async function copyOutput() {
      const outputText = document.getElementById("outputText");
      const text = outputText.value;

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          outputText.select();
          if (!document.execCommand("copy")) throw new Error("Copy failed");
        }
        showToast("✅ 已複製！");
      } catch (err) {
        try {
          outputText.select();
          if (!document.execCommand("copy")) throw new Error("Copy failed");
          showToast("✅ 已複製！");
        } catch (fallbackError) {
          showToast("複製失敗，請選取結果後手動複製。");
        }
      }
    }

    async function cleanAndCopy() {
      if (activeFormat === 'clean2') {
        cleanText2();
      } else if (activeFormat === 'preserve') {
        cleanTextPreserveMarkdown();
      } else {
        cleanText();
      }
      await copyOutput();
    }
    // Help toggle panel handlers
    const helpToggle = document.getElementById('helpToggle');
    const helpPanel = document.getElementById('helpPanel');
    const helpClose = document.getElementById('helpClose');
    const optionsToggle = document.getElementById('optionsToggle');
    const optionsPanel = document.getElementById('optionsPanel');
    const optionsClose = document.getElementById('optionsClose');

    function toggleHelp(forceOpen = null) {
      const isOpen = forceOpen === null ? helpPanel.classList.toggle('open') : (forceOpen ? (helpPanel.classList.add('open'), true) : (helpPanel.classList.remove('open'), false));
      helpToggle.setAttribute('aria-expanded', String(isOpen));
      if (isOpen && optionsPanel.classList.contains('open')) toggleOptions(false);
      // Do not automatically move focus when opening help; user requested so it doesn't jump.
    }
    function toggleOptions(forceOpen = null) {
      const isOpen = forceOpen === null ? optionsPanel.classList.toggle('open') : (forceOpen ? (optionsPanel.classList.add('open'), true) : (optionsPanel.classList.remove('open'), false));
      optionsToggle.setAttribute('aria-expanded', String(isOpen));
      if (isOpen && helpPanel.classList.contains('open')) toggleHelp(false);
    }
    helpToggle.addEventListener('click', () => toggleHelp());
    helpClose.addEventListener('click', () => toggleHelp(false));
    optionsToggle.addEventListener('click', () => toggleOptions());
    optionsClose.addEventListener('click', () => toggleOptions());
    document.getElementById('optPromoteHeadings')?.addEventListener('change', updateOptionsSummary);
    document.getElementById('optNormalizeLists')?.addEventListener('change', updateOptionsSummary);
    document.getElementById('optTableSpacing')?.addEventListener('change', updateOptionsSummary);
    document.getElementById('optHrSpacing')?.addEventListener('change', updateOptionsSummary);
    document.getElementById('optRemoveBold')?.addEventListener('change', updateOptionsSummary);
    document.getElementById('opt2RemoveBlankLines')?.addEventListener('change', updateOptionsSummary);
    document.getElementById('opt2NormalizeLists')?.addEventListener('change', updateOptionsSummary);
    document.getElementById('opt2TableSpacing')?.addEventListener('change', updateOptionsSummary);
    document.getElementById('opt2HrToSymbol')?.addEventListener('change', updateOptionsSummary);
    document.getElementById('opt2RemoveBold')?.addEventListener('change', updateOptionsSummary);
    document.getElementById('optPreserveRemoveBlankLines')?.addEventListener('change', updateOptionsSummary);
    document.getElementById('optPreserveRemoveBold')?.addEventListener('change', updateOptionsSummary);
    // Close on Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && helpPanel.classList.contains('open')) {
        toggleHelp(false);
      }
      if (e.key === 'Escape' && optionsPanel.classList.contains('open')) {
        toggleOptions(false);
      }
    });
  </script>
</body>
</html>
